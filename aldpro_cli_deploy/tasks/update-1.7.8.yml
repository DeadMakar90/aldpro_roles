---
- name: repo add
  template:
    src: sources.list.j2
    dest: /etc/apt/sources.list
  
- name: udate on 1.7.8
  apt: 
    update_cache: yes
    name: "*"
    state: latest

- name: install qemu-guest-agent
  apt:
    name: qemu-guest-agent
    state: present
    update_cache: yes

- name: qemu-guest-agent start
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: yes

