---
- name: ald_repo add
  template:
    src: aldpro.list.j2
    dest: /etc/apt/sources.list.d/aldpro.list

- name: update
  apt: 
    update_cache: yes

- name: install ald_pro dc
  shell: |
     DEBIAN_FRONTEND=noninteractive apt-get install -q -y aldpro-mp aldpro-syncer aldpro-gc
     touch /opt/rbta/aldpro/.dc_installed
  args: 
    creates: /opt/rbta/aldpro/.dc_installed
  